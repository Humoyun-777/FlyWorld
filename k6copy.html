<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимация загрузки</title>
     <link rel="icon" href="image.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .loading-container {
            text-align: center;
            color: white;
        }

        .loader {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }



        /* Sayt kontenti - faqat loading animatsiyasi */
        .main-content {
            display: none;
        }
    </style>
</head>
<body style="background:  #2980b9">
    <div class="loading-container" id="loadingScreen">
          <!-- Здесь разместите логотип вашего сайта -->
        <div class="loader"><img style="height: 70px; width: 70px;" src="image.png" alt="flyworld Logo"></div>
    </div>

    <script>
        setTimeout(function() {
            // Здесь напишите URL адрес вашего веб-сайта
            window.location.href = "turlarcopy.html";
            
            // Если хотите перенаправить на локальный файл:
            // window.location.href = "main.html";
            // Здесь напишите секунды вашего веб-сайта, здесь 1000 означает 1 секунду
        }, 1000);
    </script>
</body>
</html>
